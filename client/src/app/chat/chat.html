<section class="card">
  <header class="head">
    <div class="who">
      <div class="avatar">AI</div>
      <div>
        <p class="name">Chat Bot</p>
        <p class="status"><span class="dot"></span>Online</p>
      </div>
    </div>
    <app-settings-dialog />
  </header>

  <div class="transcript">
    @for (m of messages(); track $index) {
      <div class="row" [class.user]="m.role === 'user'">
        <div class="bubble" [class.user]="m.role === 'user'">
          <span class="text">{{ m.content }}</span>
          @if (m.model) {
            <span class="badge">{{ m.model }} · {{ (m.durationMs ?? 0) / 1000 | number: '1.1-1' }}s</span>
          }
        </div>
      </div>
    }
    @if (loading()) {
      <div class="row">
        <div class="bubble typing"><span></span><span></span><span></span></div>
      </div>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <div #bottom></div>
  </div>

  <form class="input" (ngSubmit)="send()">
    <textarea
      name="draft"
      rows="1"
      maxlength="1000"
      placeholder="Ask anything"
      [(ngModel)]="draft"
      (keydown)="onKey($event)"
    ></textarea>
    @if (streaming()) {
      <button type="button" class="stop" aria-label="Stop generating" (click)="stop()">■</button>
    } @else {
      <button type="submit" aria-label="Send" [disabled]="!draft.trim() || loading()">➤</button>
    }
  </form>
</section>
